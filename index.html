<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0D2847">
  <title>Famil · Versele — Japan 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:#0D2847; --navy-dk:#071B35; --navy-lt:#EEF4FF;
      --gold:#B07C22; --gold-lt:#FBF5E6;
      --sakura:#E8A4B2; --sakura-lt:#FDF2F5;
      --cream:#FAF8F4; --ink:#0A1A2F; --ink-2:#233D5C; --ink-3:#5A7590; --ink-4:#90A8BE;
      --border:#D8E4F0; --border-lt:#EBF2FA; --white:#FFFFFF;
      --shadow:0 2px 12px rgba(13,40,71,.10),0 1px 3px rgba(13,40,71,.06);
      --radius:18px; --radius-md:12px; --radius-sm:8px;
      --font-serif:'Cormorant Garamond','Palatino Linotype',Georgia,serif;
      --font-sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;height:100%}
    body{font-family:var(--font-sans);background:var(--cream);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;margin:0;padding:0}
    a{color:inherit;text-decoration:none}
    button{font-family:var(--font-sans);cursor:pointer;-webkit-tap-highlight-color:transparent}
    input{font-family:var(--font-sans)}
    html,body{height:100%;margin:0;padding:0}

    /* HEADER */
    #app-header{position:fixed;top:0;left:0;right:0;z-index:9999;background-color:#0D2847;background-image:linear-gradient(160deg,#0F3160 0%,#0D2847 55%,#071B35 100%);border-bottom:1px solid rgba(255,255,255,.08)}
    .hdr-top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 4px}
    .hdr-left{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .hdr-flag{font-size:17px;flex-shrink:0}
    .hdr-dest{font-family:var(--font-serif);font-size:14px;font-weight:300;letter-spacing:.4px;color:#fff;white-space:nowrap}
    .hdr-hc{font-size:8px;color:rgba(255,255,255,.40);letter-spacing:.8px;text-transform:uppercase;margin-top:1px}
    .hdr-names{text-align:center;padding:0 14px 7px;border-bottom:1px solid rgba(255,255,255,.06)}
    .hdr-name{font-family:var(--font-serif);font-size:clamp(20px,4.6vw,32px);font-weight:300;letter-spacing:.4px;color:#fff;line-height:1.15}
    .hdr-name2{font-size:clamp(9px,1.8vw,11px);color:rgba(255,255,255,.45);letter-spacing:1.4px;text-transform:uppercase;margin-top:3px}
    .hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
    #jst-clock{font-family:'SF Mono','Menlo',monospace;font-size:14px;font-weight:300;letter-spacing:1px;color:#fff;display:block;text-align:right;white-space:nowrap}
    #trip-day-label{font-size:8.5px;color:rgba(255,255,255,.38);letter-spacing:.4px;margin-top:1px;display:block;text-align:right;white-space:nowrap}

    /* TAB NAV */
    .tab-nav{display:flex;border-top:1px solid rgba(255,255,255,.07);overflow-x:auto;scrollbar-width:none}
    .tab-nav::-webkit-scrollbar{display:none}
    .tab-btn{flex-shrink:0;background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.78);font-size:11.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:9px 13px 7px;transition:color .18s,border-color .18s;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
    .tab-btn.active{color:var(--sakura);border-bottom-color:var(--sakura)}

    /* MAIN */
    #main-content{overflow-y:auto;-webkit-overflow-scrolling:touch;height:100vh;}
    .tab-panel{display:none;padding:14px 14px 80px;animation:panelFade .22s ease both}
    .tab-panel.active{display:block}
    @keyframes panelFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    /* BANNER */
    .trip-banner{background:linear-gradient(135deg,#0D2847 0%,#0A2040 55%,#04111F 100%);border-radius:var(--radius);padding:22px 20px 20px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden}
    .trip-banner::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E") repeat}
    .trip-banner-kana{font-family:var(--font-serif);font-size:11px;font-style:italic;opacity:.55;letter-spacing:1px;margin-bottom:4px;position:relative}
    .trip-banner h2{font-family:var(--font-serif);font-size:28px;font-weight:300;letter-spacing:1px;margin-bottom:4px;position:relative}
    .trip-banner .banner-dates{font-size:13px;opacity:.72;position:relative}
    .banner-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;position:relative}
    .banner-chip{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:4px 10px;font-size:11px}
    .banner-chip.confirmed{background:rgba(217,234,211,.25);border-color:rgba(217,234,211,.5)}

    .section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-4);padding:8px 2px 6px}

    /* LEGEND */
    .booking-legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 14px;background:var(--white);border-radius:var(--radius-md);margin-bottom:10px;border:1px solid var(--border-lt)}
    .bl-item{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-3);font-weight:500}
    .bl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
    .bl-dot.confirmed{background:#D9EAD3;border:1px solid rgba(27,94,32,.3)}
    .bl-dot.requested{background:#00FFFF;border:1px solid rgba(0,77,86,.3)}
    .bl-dot.self-booked{background:#F4CCCC;border:1px solid rgba(123,26,26,.3)}
    .bl-dot.suggestion{background:#9FC5E8;border:1px solid rgba(13,60,110,.3)}
    .bl-dot.pending{background:#ECEFF1;border:1px solid rgba(84,110,122,.35)}

    /* DAY CARDS */
    .day-card{background:var(--white);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border-lt);animation:cardIn .28s ease both}
    @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .day-card.is-today{border-color:var(--navy);box-shadow:0 0 0 1.5px var(--navy),var(--shadow)}
    .day-card.is-past{opacity:.58}
    .day-header{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
    .day-num{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--border-lt);color:var(--ink-3)}
    .day-card.is-today .day-num{background:var(--navy);color:#fff}
    .day-header-info{flex:1;min-width:0}
    .day-name{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .day-theme{font-size:11.5px;color:var(--ink-3);font-family:var(--font-serif);font-style:italic;margin-top:1px}
    .day-sub{font-size:11px;color:var(--ink-4);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .day-city-badge{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:#EBF3FF;color:#1A5FAA}
    .day-city-badge.setouchi{background:#F1EBE0;color:#7A5C1F}
    .day-city-badge.transit{background:#EFEFEF;color:#6A6A6A}
    .today-pill{font-size:10px;font-weight:700;background:var(--navy);color:#fff;padding:2px 8px;border-radius:20px}
    .host-pill{font-size:10px;font-weight:600;background:rgba(176,124,34,.15);color:var(--gold);padding:2px 8px;border-radius:20px;border:1px solid rgba(176,124,34,.25)}
    .day-chevron{color:var(--ink-4);font-size:14px;flex-shrink:0;transition:transform .25s cubic-bezier(.4,0,.2,1)}
    .day-card.open .day-chevron{transform:rotate(180deg)}
    .day-body{max-height:0;overflow:hidden;transition:max-height .38s cubic-bezier(.4,0,.2,1)}
    .day-card.open .day-body{max-height:9000px}
    .day-body-inner{padding:0 16px 16px}

    .hotel-bar{display:flex;align-items:center;gap:10px;border-radius:var(--radius-md);padding:10px 13px;margin-bottom:12px;background:#EBF4FF;border-left:3px solid #0D2847}
    .hb-name{font-size:12px;font-weight:600;color:#0D2847}
    .hb-detail{font-size:11px;color:#1A3F6F;margin-top:1px}
    .hb-link{margin-left:auto;font-size:11px;font-weight:500;flex-shrink:0;color:#0D2847}

    .day-note-bar{background:var(--navy-lt);border-radius:var(--radius-md);border-left:3px solid #4A80C0;padding:10px 13px;font-size:12px;color:var(--ink-2);line-height:1.55;margin-bottom:12px}

    .weather-widget{display:flex;align-items:center;gap:10px;background:var(--gold-lt);border-radius:var(--radius-md);border:1px solid rgba(176,124,34,.15);padding:10px 13px;margin-bottom:14px}
    .wx-icon{font-size:26px}.wx-info{flex:1}.wx-temp{font-size:14px;font-weight:600}.wx-desc{font-size:11px;color:var(--ink-3);margin-top:2px}.wx-rain{font-size:12px;font-weight:500;color:#1D6FAD;flex-shrink:0}
    .wx-loading{font-size:12px;color:var(--ink-4);animation:pulse 1.5s ease infinite}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

    /* TIMELINE */
    .timeline{position:relative;padding-left:75px}
    .stop-item{position:relative;margin-bottom:14px}
    .stop-item::after{content:'';position:absolute;left:-16px;top:29px;bottom:-14px;width:2px;background:var(--border);z-index:1}
    .stop-item:last-child::after{display:none}
    .stop-time{position:absolute;left:-70px;top:11px;width:42px;text-align:right;font-size:10px;font-weight:600;color:var(--ink-4);line-height:1.4}
    .stop-dot{position:absolute;left:-25px;top:9px;width:18px;height:18px;border-radius:50%;border:2.5px solid #ccc;background:#fff;z-index:2}
    .stop-dot.t-restaurant{border-color:#8B1A1A;background:#F8EDED}
    .stop-dot.t-activity{border-color:#6650CC;background:#EEE8FF}
    .stop-dot.t-transport{border-color:#0D2847;background:#EEF4FF}
    .stop-dot.t-hotel{border-color:#2E7D32;background:#E8F5E9}
    .stop-dot.t-flight{border-color:#0277BD;background:#E1F5FE}
    .stop-dot.t-ferry{border-color:#00838F;background:#E0F7FA}
    .stop-dot.t-suggestion{border-color:#1565C0;background:#E3F2FD}
    .stop-dot.t-pending{border-color:#607D8B;background:#ECEFF1}
    .stop-card{background:var(--cream);border-radius:var(--radius-md);border:1px solid var(--border-lt);padding:11px 13px}
    .stop-card.is-suggestion{background:#F0F7FF;border-color:rgba(21,101,192,.15)}
    .stop-card.is-pending{background:#F5F5F5;border-color:rgba(96,125,139,.15)}
    .stop-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .stop-title-wrap{flex:1;min-width:0}
    .stop-icon{font-size:13px;margin-right:5px}
    .stop-title{font-size:14px;font-weight:600;color:var(--ink);line-height:1.3}
    .stop-subtitle{font-size:11px;color:var(--ink-3);margin-top:2px}

    .stop-badge{font-size:9.5px;font-weight:600;padding:3px 9px;border-radius:5px;flex-shrink:0;white-space:nowrap;letter-spacing:.1px}
    .stop-badge.confirmed  {background:#D9EAD3;color:#1B5E20;border:1px solid rgba(27,94,32,.18)}
    .stop-badge.requested  {background:#00FFFF;color:#004D56;border:1px solid rgba(0,77,86,.18)}
    .stop-badge.self-booked{background:#F4CCCC;color:#7B1A1A;border:1px solid rgba(123,26,26,.18)}
    .stop-badge.suggestion {background:#9FC5E8;color:#0D3C6E;border:1px solid rgba(13,60,110,.18)}
    .stop-badge.pending    {background:#ECEFF1;color:#546E7A;border:1px solid rgba(84,110,122,.2)}
    .stop-badge.logistics  {background:#FFE0B2;color:#BF360C;border:1px solid rgba(191,54,12,.18)}

    .stop-notes{font-size:12px;color:var(--ink-2);line-height:1.55;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-lt)}
    .stop-alert{display:flex;align-items:flex-start;gap:6px;margin-top:8px;padding:7px 10px;background:#FFFBEB;border-radius:var(--radius-sm);border-left:3px solid #F59E0B;font-size:11px;color:#92400E;font-weight:500;line-height:1.4}
    .map-actions{display:flex;gap:5px;margin-top:10px}
    .map-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 5px;border-radius:var(--radius-sm);font-size:11px;font-weight:500;min-height:34px;border:1px solid var(--border);background:var(--white);color:var(--ink-2);cursor:pointer;-webkit-tap-highlight-color:transparent}
    .map-btn:active{transform:scale(.96)}
    .map-btn.map-disabled{color:var(--border);cursor:default;background:var(--border-lt);border-color:var(--border-lt);pointer-events:none;opacity:.4}
    .map-btn.mp{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}

    /* CARDS / LISTS */
    .util-card{background:var(--white);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border-lt);margin-bottom:12px}
    .util-card-title{font-family:var(--font-serif);font-size:18px;font-weight:400;color:var(--ink);margin-bottom:14px;letter-spacing:.3px}
    .fx-row{display:flex;gap:8px;align-items:flex-end}
    .fx-group{flex:1}
    .fx-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-4);margin-bottom:5px}
    .fx-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:18px;font-weight:500;color:var(--ink);background:var(--cream);outline:none;-webkit-appearance:none}
    .fx-input:focus{border-color:var(--navy)}
    .fx-swap-btn{width:38px;height:38px;border-radius:50%;background:var(--navy-lt);border:none;color:var(--navy);font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:1px;cursor:pointer}
    .fx-rate-note{font-size:11px;color:var(--ink-4);text-align:center;margin-top:10px;line-height:1.5}
    .info-list{list-style:none}
    .info-list li{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--border-lt);font-size:13px;line-height:1.55}
    .info-list li:last-child{border-bottom:none;padding-bottom:0}
    .info-emoji{font-size:17px;flex-shrink:0;margin-top:1px}
    .info-text{color:var(--ink-2)}
    .info-text strong{color:var(--ink);display:block;margin-bottom:1px}
    .rule-item{padding:9px 0;border-bottom:1px solid var(--border-lt);display:flex;gap:10px;font-size:12.5px;line-height:1.5}
    .rule-item:last-child{border-bottom:none}
    .rule-icon{font-size:15px;flex-shrink:0;margin-top:1px}
    .rule-text strong{color:var(--ink)}

    /* ART PROGRAMME */
    .art-banner{background:linear-gradient(135deg,#2A1E3F 0%,#150F24 100%);border-radius:var(--radius);padding:22px 20px 18px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden}
    .art-banner::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E") repeat}
    .art-banner h2{font-family:var(--font-serif);font-size:26px;font-weight:300;letter-spacing:.8px;margin-bottom:4px;position:relative}
    .art-banner p{font-size:12px;opacity:.7;position:relative;margin:0}
    .thread-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border-lt);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
    .thread-head{display:flex;align-items:baseline;gap:10px;padding:15px 18px 4px}
    .thread-idx{font-family:var(--font-serif);font-size:20px;color:var(--gold);flex-shrink:0;line-height:1}
    .thread-title{font-family:var(--font-serif);font-size:19px;font-weight:500;color:var(--ink);line-height:1.2}
    .thread-where{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);padding:0 18px 8px 46px}
    .thread-body{font-size:13px;color:var(--ink-2);line-height:1.6;padding:0 18px 12px 46px}
    .thread-tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 16px 46px}
    .thread-tag{font-size:11px;padding:4px 10px;border-radius:99px;background:var(--cream);border:1px solid var(--border-lt);color:var(--ink-2)}
    .host-bio{padding:16px 18px 14px;border-bottom:1px solid var(--border-lt)}
    .host-bio:last-child{border-bottom:none}
    .host-bio-name{font-family:var(--font-serif);font-size:18px;font-weight:500;color:var(--ink);letter-spacing:.2px}
    .host-bio-meta{font-size:11px;color:var(--ink-3);font-style:italic;margin-top:2px;font-family:var(--font-serif);margin-bottom:8px}
    .host-bio-text{font-size:13px;color:var(--ink-2);line-height:1.6;margin:0}

    /* LOGISTICS TABLE */
    .lg-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-lt)}
    .lg-row:last-child{border-bottom:none}
    .lg-date{font-size:11px;font-weight:600;color:var(--ink-4);width:58px;flex-shrink:0;letter-spacing:.04em;padding-top:2px}
    .lg-main{flex:1;min-width:0}
    .lg-name{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3}
    .lg-note{font-size:11.5px;color:var(--ink-3);margin-top:2px}
    .lg-status{font-size:9.5px;font-weight:600;padding:3px 9px;border-radius:5px;flex-shrink:0;white-space:nowrap;align-self:center}
    .lg-status.ok{background:#D9EAD3;color:#1B5E20;border:1px solid rgba(27,94,32,.18)}
    .lg-status.todo{background:#FFE0B2;color:#BF360C;border:1px solid rgba(191,54,12,.18)}
    .open-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border-lt);font-size:13px;line-height:1.55;color:var(--ink-2)}
    .open-item:last-child{border-bottom:none}
    .open-item strong{color:var(--ink);display:block;margin-bottom:1px}
    .open-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:7px}

    /* DISCOVER */
    .disc-banner{background:linear-gradient(135deg,#0D2847 0%,#0A2040 55%,#04111F 100%);border-radius:var(--radius);padding:22px 20px 18px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden}
    .disc-banner h2{font-family:var(--font-serif);font-size:26px;font-weight:300;letter-spacing:.8px;margin-bottom:4px;position:relative}
    .disc-banner p{font-size:12px;opacity:.65;position:relative;margin:0}
    .disc-city-bar{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
    .disc-city-bar::-webkit-scrollbar{display:none}
    .disc-city-pill{flex-shrink:0;background:var(--white);border:1px solid var(--border);color:var(--ink-3);padding:9px 16px;border-radius:99px;font-size:12px;font-weight:600;letter-spacing:.04em;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s,color .15s,border-color .15s}
    .disc-city-pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .disc-note{font-size:12px;color:var(--ink-3);font-style:italic;line-height:1.55;margin-bottom:10px;padding:8px 12px;background:var(--gold-lt);border-radius:8px;border-left:2px solid rgba(176,124,34,.4)}
    .disc-card{background:var(--white);border:1px solid var(--border-lt);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
    .disc-card-head{padding:14px 18px 10px;border-bottom:1px solid var(--border-lt)}
    .disc-card-head-title{font-family:var(--font-serif);font-size:18px;font-weight:500;color:var(--ink)}
    .disc-card-body{padding:8px 12px 12px}
    .disc-item{display:flex;align-items:center;gap:12px;padding:10px 10px;background:var(--cream);border-radius:10px;margin-bottom:6px;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:background .15s;border:1px solid var(--border-lt)}
    .disc-item:last-child{margin-bottom:0}
    .disc-item:active{background:var(--border-lt)}
    .disc-item-info{flex:1;min-width:0}
    .disc-item-name{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.25}
    .disc-item-sub{font-size:11px;color:var(--ink-3);margin-top:2px;font-style:italic}
    .disc-arrow{font-size:16px;color:var(--gold);flex-shrink:0;opacity:.8}

    /* EMERGENCY */
    .emergency-banner{background:var(--navy);border-radius:var(--radius);padding:18px 20px;color:#fff;margin-bottom:14px;text-align:center}
    .emergency-banner h2{font-family:var(--font-serif);font-size:22px;font-weight:300;letter-spacing:.5px;margin-bottom:4px}
    .emergency-banner p{font-size:12px;opacity:.75}
    .contact-card{background:var(--white);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border-lt);margin-bottom:12px}
    .contact-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border-lt);gap:10px}
    .contact-row:last-child{border-bottom:none}
    .contact-left{display:flex;align-items:center;gap:12px}
    .contact-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
    .ci-r{background:#FFEBEE}.ci-b{background:#E3F2FD}.ci-n{background:var(--navy-lt)}.ci-o{background:#FFF3E0}
    .contact-label{font-size:13px;font-weight:600;color:var(--ink)}
    .contact-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
    .call-btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;white-space:nowrap;border:none;cursor:pointer}
    .cn{background:var(--navy);color:#fff}.cr{background:#C62828;color:#fff}.cb{background:#0277BD;color:#fff}

    #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(13,40,71,.92);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;pointer-events:none;opacity:0;transition:all .22s cubic-bezier(.4,0,.2,1);z-index:999;white-space:nowrap;max-width:90vw}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(min-width:700px){
      .tab-nav{padding:0 30px}
      .tab-btn{font-size:12.5px;padding:10px 18px}
      .tab-panel{max-width:900px;margin-left:auto;margin-right:auto;padding:24px 32px 60px}
    }
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    @media(prefers-color-scheme:dark){
      :root{--cream:#0E1824;--white:#141F2E;--border:#1E3248;--border-lt:#182840;--ink:#E8F2FF;--ink-2:#A8C0DC;--ink-3:#607A94;--ink-4:#3A5470;--navy-lt:#101E30;--gold-lt:#1A1508;--sakura-lt:#2A1A20}
    }

/* ═══ HELPERS ═══ */
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function gm(q){return(q&&q.indexOf('http')===0)?q:'https://maps.google.com/?q='+encodeURIComponent(q||'Japan');}
function nav(q){return(q&&q.indexOf('http')===0)?q:'https://maps.google.com/maps?daddr='+encodeURIComponent(q||'Japan')+'&dirflg=d';}
var toastTm;
function showToast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTm);toastTm=setTimeout(function(){el.classList.remove('show');},2200);}
window.copyAddr=function(di,si){
  var stop=TRIP.days[di].stops[si];
  var txt=(stop.addr&&stop.addr.length>8)?stop.addr:stop.loc;
  if(!txt)return;
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(function(){showToast('Address copied');});}
  else{var ta=document.createElement('textarea');ta.value=txt;ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('Address copied');}
};

/* ═══ CLOCK ═══ */
function jst(){return new Date(Date.now()+9*3600000);}
function isoToday(){return jst().toISOString().slice(0,10);}
function tickClock(){
  var d=jst();
  document.getElementById('jst-clock').textContent=String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
  var today=d.toISOString().slice(0,10),found=null;
  for(var i=0;i<TRIP.days.length;i++){if(TRIP.days[i].date===today){found=TRIP.days[i];break;}}
  var lbl=document.getElementById('trip-day-label');
  if(found)lbl.textContent='Day '+found.dayNum+' of 9 · '+found.city;
  else if(today<TRIP.startDate){var ms=new Date(TRIP.startDate)-new Date(today);var d2=Math.ceil(ms/86400000);lbl.textContent=d2===1?'Departure tomorrow':d2+'d to departure';}
  else if(today>TRIP.endDate)lbl.textContent='Japan leg complete';
  else lbl.textContent='Japan Standard Time';
}

function renderStop(stop,di,si){
  var isSuggestion=stop.badgeType==='suggestion'||stop.badgeType==='pending';
  var hasLoc=!!(stop.q||stop.loc);
  var icon=ICONS[stop.type]||'📍';
  var badge=stop.badge?'<span class="stop-badge '+stop.badgeType+'">'+esc(stop.badge)+'</span>':'';
  var dotClass=isSuggestion?'t-suggestion':('t-'+(stop.type||'activity'));
  var cardClass=stop.badgeType==='suggestion'?' is-suggestion':(stop.badgeType==='pending'?' is-pending':'');
  var mapHTML=hasLoc
    ?'<a href="'+gm(stop.q)+'" target="_blank" rel="noopener" class="map-btn mp">📍 Maps</a>'
      +'<a href="'+nav(stop.q)+'" target="_blank" rel="noopener" class="map-btn">🧭 Nav</a>'
      +'<button class="map-btn" onclick="copyAddr('+di+','+si+')">⎘ Copy</button>'
    :'<span class="map-btn map-disabled">📍</span><span class="map-btn map-disabled">🧭</span><span class="map-btn map-disabled">⎘</span>';
  return '<div class="stop-item">'
    +'<div class="stop-time">'+(stop.time?stop.time.replace('~',''):'')+'</div>'
    +'<div class="stop-dot '+dotClass+'"></div>'
    +'<div class="stop-card'+cardClass+'"><div class="stop-top">'
    +'<div class="stop-title-wrap">'
    +'<div class="stop-title"><span class="stop-icon">'+icon+'</span>'+esc(stop.title)+'</div>'
    +(stop.sub?'<div class="stop-subtitle">'+esc(stop.sub)+'</div>':'')
    +'</div>'+badge+'</div>'
    +(stop.notes?'<div class="stop-notes">'+esc(stop.notes)+'</div>':'')
    +(stop.alert?'<div class="stop-alert">⚠ '+esc(stop.alert)+'</div>':'')
    +'<div class="map-actions">'+mapHTML+'</div>'
    +'</div></div>';
}

/* ═══ WEATHER · Open-Meteo ═══ */
function wmo(c){
  if(c===0)return{i:'☀️',d:'Clear'};
  if(c<=2)return{i:'⛅',d:'Partly cloudy'};
  if(c===3)return{i:'☁️',d:'Overcast'};
  if(c>=45&&c<=48)return{i:'🌫️',d:'Foggy'};
  if(c>=51&&c<=67)return{i:'🌧️',d:'Rain'};
  if(c>=80&&c<=82)return{i:'🌦️',d:'Showers'};
  if(c>=95)return{i:'⛈️',d:'Thunderstorm'};
  return{i:'🌤️',d:'Mixed'};
}
function loadWeather(){
  var COORD={'Tokyo':[35.6762,139.6503],'Takamatsu':[34.3428,134.0466],'Kurashiki':[34.5850,133.7720],'Busan':[35.1796,129.0756]};
  var cities={};
  TRIP.days.forEach(function(d){if(COORD[d.city])cities[d.city]=COORD[d.city];});
  var names=Object.keys(cities);
  var reqs=names.map(function(c){
    var ll=cities[c];
    var u='https://api.open-meteo.com/v1/forecast?latitude='+ll[0]+'&longitude='+ll[1]+'&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&timezone=Asia%2FTokyo&forecast_days=16';
    return fetch(u).then(function(r){return r.json();}).then(function(j){return {city:c,daily:j.daily};});
  });
  function fallback(day){
    var el=document.getElementById('wx-'+day.date);
    if(!el)return;
    el.innerHTML='<span class="wx-icon">🍁</span><div class="wx-info"><div class="wx-temp" style="font-size:13px">'+esc(day.city)+' · late October</div>'
      +'<div class="wx-desc">Forecast appears closer to the day · autumn, roughly 13–22°C</div></div>';
  }
  Promise.all(reqs).then(function(results){
    var byCity={};results.forEach(function(r){byCity[r.city]=r.daily;});
    TRIP.days.forEach(function(day){
      var src=byCity[day.city];
      var el=document.getElementById('wx-'+day.date);
      if(!el)return;
      var idx=src&&src.time?src.time.indexOf(day.date):-1;
      if(!src||idx===-1){fallback(day);return;}
      var e=wmo(src.weathercode[idx]);
      var hi=Math.round(src.temperature_2m_max[idx]);
      var lo=Math.round(src.temperature_2m_min[idx]);
      var rain=src.precipitation_probability_max[idx]||0;
      el.innerHTML='<span class="wx-icon">'+e.i+'</span>'
        +'<div class="wx-info"><div class="wx-temp">'+hi+'° / '+lo+'°C · '+e.d+'</div>'
        +'<div class="wx-desc">'+esc(day.city)+' · late autumn</div></div>'
        +'<div class="wx-rain">💧 '+rain+'%</div>';
    });
  }).catch(function(){TRIP.days.forEach(fallback);});
}

/* ═══ RENDER · DISCOVER ═══ */
function renderDiscover(){

  h+='<div class="disc-city-bar" role="tablist" aria-label="Select area">';
  DISCOVER_CITIES.forEach(function(c){
    h+='<button class="disc-city-pill'+(c===city?' active':'')+'" data-disc-city="'+esc(c)+'">'+esc(c)+'</button>';
  });
  h+='</div>';
  h+='<div class="disc-note">Beyond the fixed programme — things worth an hour if the day runs early, or on the arrival afternoon in Tokyo.</div>';
  sections.forEach(function(section){
    h+='<div class="disc-card"><div class="disc-card-head"><div class="disc-card-head-title">'+esc(section.cat)+'</div></div><div class="disc-card-body">';
    section.items.forEach(function(item){
      var subHtml=item[2]?'<div class="disc-item-sub">'+esc(item[2])+'</div>':'';
      h+='<a class="disc-item" href="'+gm(item[1])+'" target="_blank" rel="noopener">'

/* ═══ RENDER · UTILITIES ═══ */
function renderUtilities(){
  document.getElementById('tab-utilities').innerHTML=''
    +'<div class="section-label">Currency Converter</div>'
    +'<div class="util-card"><div class="util-card-title">JPY ↔ EUR</div>'
    +'<div class="fx-row">'
    +'<div class="fx-group"><div class="fx-label">🇯🇵 Japanese Yen</div><input class="fx-input" id="fx-jpy" type="text" inputmode="numeric" value="10.000"></div>'
    +'<button class="fx-swap-btn" id="fx-swap" aria-label="Swap">⇋</button>'
    +'<div class="fx-group"><div class="fx-label">🇪🇺 Euro</div><input class="fx-input" id="fx-eur" type="text" inputmode="decimal"></div>'
    +'</div><div class="fx-rate-note">Rate: 1 EUR = '+new Intl.NumberFormat('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}).format(FX_RATE)+' JPY · planning estimate</div></div>'
    +'<div class="section-label">Quick Reference</div>'
    +'<div class="util-card"><ul class="info-list">'
    +'<li><span class="info-emoji">💴</span><div class="info-text"><strong>Carry some cash</strong>Island museums, small ateliers, taxis and the charter boat are easier with yen. ATMs at 7-Eleven and Japan Post take foreign cards.</div></li>'
    +'<li><span class="info-emoji">🍁</span><div class="info-text"><strong>Late October</strong>One of the best weeks of the year — dry, clear and roughly 13–22°C. The Setouchi islands are exposed and windier on the water; bring a layer for the charter.</div></li>'
    +'<li><span class="info-emoji">👟</span><div class="info-text"><strong>Walking</strong>Yanaka, the islands and Kurashiki are all done on foot, much of it on stone and gravel. Comfortable shoes matter more than anything else you pack.</div></li>'
    +'<li><span class="info-emoji">🧳</span><div class="info-text"><strong>Luggage forwarding</strong>Takuhaibin can send the main bags Tokyo → Takamatsu, or ahead to Kurashiki, so only overnight bags travel on the 26th. Easily added.</div></li>'
    +'<li><span class="info-emoji">📱</span><div class="info-text"><strong>Suica in the phone wallet</strong>Wallet → + → Suica. Covers JR, subway, buses and IC readers nationwide.</div></li>'
    +'<li><span class="info-emoji">🛂</span><div class="info-text"><strong>Korea on the 30th</strong>K-ETA requirements depend on nationality — confirm for all four passports before departure, not at the airport.</div></li>'
    +'<li><span class="info-emoji">⏰</span><div class="info-text"><strong>JST = UTC+9</strong>Seven hours ahead of Brussels in late October. No daylight saving in Japan.</div></li>'
    +'<li><span class="info-emoji">🔌</span><div class="info-text"><strong>100V · Type A sockets</strong>European plugs need an adapter; most laptop and phone chargers handle the voltage.</div></li>'
    +'<li><span class="info-emoji">📡</span><div class="info-text"><strong>eSIM</strong>Activate before landing — Airalo, HolaFly or Ubigi all work well.</div></li>'
    +'</ul></div>'
    +'<div class="section-label">In the Museums</div>'
    +'<div class="util-card"><div class="util-card-title">📸 Photography &amp; timed entry</div>'
    +'<div class="rule-item"><span class="rule-icon">•</span><div class="rule-text"><strong>Chichu, Lee Ufan and Teshima</strong> do not allow photography inside. Phones stay away; the guards are firm and it is part of how the buildings work.</div></div>'
    +'<div class="rule-item"><span class="rule-icon">•</span><div class="rule-text"><strong>Timed admission</strong> applies at Chichu and the Noguchi Garden Museum. Arriving late means losing the slot.</div></div>'
    +'<div class="rule-item"><span class="rule-icon">•</span><div class="rule-text"><strong>Many island museums close on Mondays</strong> — the routing is already built around this.</div></div>'
    +'<div class="rule-item"><span class="rule-icon">•</span><div class="rule-text"><strong>Bags and coats</strong> often go into lockers before entry. Travel light on museum days.</div></div>'
    +'</div>'
    +'<div class="util-card"><div class="util-card-title">⛴️ On the water</div>'
    +'<div class="rule-item"><span class="rule-icon">•</span><div class="rule-text"><strong>The 26th runs on a private charter</strong> — it is what makes Inujima and Teshima possible in one day, so the schedule holds firm.</div></div>'
    +'<div class="rule-item"><span class="rule-icon">•</span><div class="rule-text"><strong>The 08:10 Naoshima ferry</strong> on the 28th is a public sailing. Be at Takamatsu Port with time in hand.</div></div>'
    +'<div class="rule-item"><span class="rule-icon">•</span><div class="rule-text"><strong>The inland sea is calm but breezy.</strong> A windproof layer is worth having on deck even in fine weather.</div></div>'
    +'</div>'
    +'<div class="disc-note" style="text-align:center">Craft, carried forward — from Reiko Sudo\u0027s looms to Noguchi\u0027s stone yard and an island of refinery ruins.<br><span style="color:var(--gold)">Unlocking Japan, one thoughtful moment at a time.</span></div>';

  var jEl=document.getElementById('fx-jpy'),uEl=document.getElementById('fx-eur');
  var grp=new Intl.NumberFormat('de-DE',{maximumFractionDigits:0});
  function groupInt(d){return d===''?'':grp.format(parseInt(d,10));}
  function toEnd(el){try{var n=el.value.length;el.setSelectionRange(n,n);}catch(e){}}
  function fmtJPY(n){return isNaN(n)?'':grp.format(Math.round(n));}
  function fmtEUR(n){return isNaN(n)?'':new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);}
  function onJPY(){
    var d=jEl.value.replace(/[^0-9]/g,'');
    jEl.value=groupInt(d);toEnd(jEl);
    uEl.value=d===''?'':fmtEUR(parseInt(d,10)/FX_RATE);
  }
  function onEUR(){
    var m=uEl.value.replace(/\./g,'').match(/^(\d*)(,?)(\d{0,2})/);
    var ip=m?m[1]:'',cm=m&&m[2]?',':'',dp=m?m[3]:'';
    uEl.value=groupInt(ip)+cm+dp;toEnd(uEl);
    var v=(ip===''&&dp==='')?NaN:parseFloat((ip||'0')+'.'+(dp||'0'));
    jEl.value=isNaN(v)?'':fmtJPY(v*FX_RATE);
  }
  jEl.addEventListener('input',onJPY);
  uEl.addEventListener('input',onEUR);
  document.getElementById('fx-swap').addEventListener('click',function(){
    var jv=parseInt(jEl.value.replace(/[^0-9]/g,'')||'',10);
    var em=uEl.value.replace(/\./g,'').match(/^(\d*),?(\d{0,2})/);
    var ev=em?parseFloat((em[1]||'0')+'.'+(em[2]||'0')):NaN;
    jEl.value=isNaN(ev)?'':fmtJPY(ev*FX_RATE);
    uEl.value=isNaN(jv)?'':fmtEUR(jv/FX_RATE);
  });
  onJPY();
}
